<header class="app-header">
  <div class="app-header__inner">
    <a class="brand" routerLink="/">
      <span class="brand__mark" aria-hidden="true">◆</span>
      Conf Planner
    </a>

    <nav aria-label="Navigation principale">
      <ul class="nav">
        <li>
          <a
            routerLink="/"
            routerLinkActive="is-active"
            [routerLinkActiveOptions]="{ exact: true }"
            ariaCurrentWhenActive="page"
          >
            Programme
          </a>
        </li>
        <li>
          <a routerLink="/favoris" routerLinkActive="is-active" ariaCurrentWhenActive="page">
            Mes favoris <span class="nav__counter">{{ favoritesCount() }}</span>
          </a>
        </li>
      </ul>
    </nav>
  </div>
</header>

<main #main id="contenu" class="app-main" tabindex="-1">
  <router-outlet />
</main>

<footer class="app-footer">
  Démo de la formation « Skill Issue » · données fictives
</footer>
